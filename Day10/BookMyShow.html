<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styler.css">
</head>
<body>
    <header>
        <div class="head">
            <div class="logo">
                <div class="left">
                    <h1>BookMyShow</h1>
                </div>
                <div class="right">
                    <button>Movies</button>
                    <button>Events</button>
                    <button>Sports</button>
                    <button>More</button>
                </div>
            </div>

            <div class="search">
                <input type="text" class="searching" placeholder="Search for Movie, Sports or Event">
                <button>Search</button>
            </div>
        </div>
    </header>

    <main>
        <div class="hero">
            <h2>Experience the Best Movies and Events</h2>
            <button>Book Now</button>
        </div>

        <div class="mover">
            <h2>Popular Movies</h2>
        </div>
        <div class="movie">
            <div class="card">
                <img src="./img1.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Pati Patni Aur Woh Do</h3>
            </div>

            <div class="card">
                <img src="./img2.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Bhoot Bangla</h3>
            </div>

            <div class="card">
                <img src="./img3.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Raja Shiva ji</h3>
            </div>

            <div class="card">
                <img src="./img4.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Krishnavataram</h3>
            </div>

            <div class="card">
                <img src="./img5.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>It</h3>
            </div>

            <div class="card">
                <img src="./img6.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Aakhri Sawaal</h3>
            </div>
            <div class="card">
                <img src="./img7.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Dadi ki Shadi</h3>
            </div>
            <div class="card">
                <img src="./img8.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Dhurandhar</h3>
            </div>
            <div class="card">
                <img src="./img9.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Michecl</h3>
            </div>
            <div class="card">
                <img src="./img10.webp" alt="Pati Patni Aur Woh Do" class="images">
                <h3>Marry </h3>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="bot">
            <img src="./bottoms.avif" alt="">
            <br>
        </div>
    </footer>
</body>
</html>
